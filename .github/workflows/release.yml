name: Release

# Tagging vX.Y.Z builds the release tarballs for all supported
# architectures (the upstream core is downloaded from the URLs pinned in
# manifest.json and verified against its SHA-256s) and publishes a GitHub
# release with per-file .sha256 checksums.
#
# Prerequisites once per repository: none beyond Actions defaults — the
# GITHUB_TOKEN is enough. See docs/PUBLISHING.ru.md for the full flow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (vX.Y.Z), publish skipped'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/}"; fi
          if [ -z "$v" ]; then echo "::error::no version (tag the commit vX.Y.Z)"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: sh scripts/build.sh --version "${{ steps.version.outputs.value }}" --core download

      - name: Smoke-test the produced release (fake-core e2e)
        run: sh tests/e2e_smoke.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # concise release notes: just the commit subjects since the previous tag
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then
              git log --pretty=format:"- %s" "$PREV..HEAD"
            else
              git log --pretty=format:"- %s" HEAD
            fi
          } > release-notes.md
          gh release create "$VERSION" \
            dist/opffk-$VERSION-linux-*.tar.gz \
            dist/opffk-$VERSION-linux-*.tar.gz.sha256 \
            --title "opffk $VERSION" \
            --generate-notes \
            --notes-file release-notes.md \
          || { # release already exists (tag was moved): replace its assets
               gh release upload "$VERSION" \
                 dist/opffk-$VERSION-linux-*.tar.gz \
                 dist/opffk-$VERSION-linux-*.tar.gz.sha256 --clobber
               gh release edit "$VERSION" --notes-file release-notes.md; }
